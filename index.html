<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1018"><title>Gamer Hub MH</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#141c28;--line:#283547;--muted:#9ba9bb;--lime:#c9ff65;--red:#ff665f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% -10%,#283a32 0,transparent 40%),var(--bg);color:#f3f6fb;font:14px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hero{padding:24px 18px 18px;background:linear-gradient(135deg,#172333dd,#0d131de8);border-bottom:1px solid var(--line)}.eyebrow{color:var(--lime);font-size:10px;font-weight:800;letter-spacing:2px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--lime);color:#131a0d;font-size:26px;box-shadow:0 0 28px #c9ff6522}.brand h1{font-size:23px;margin:2px 0;letter-spacing:-.7px}.brand p{color:var(--muted);margin:0;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{border:1px solid #ffffff12;background:#ffffff08;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:var(--muted);letter-spacing:.6px}.nav{display:flex;overflow:auto;gap:5px;padding:9px;background:#0d131d;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav button{flex:1;min-width:68px;border:0;background:transparent;color:var(--muted);padding:11px 7px;border-radius:10px;font-size:11px}.nav button.active{background:#29382b;color:var(--lime);font-weight:800}.wrap{padding:16px;max-width:900px;margin:auto;min-height:58vh}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.head h2{font-size:17px;margin:0}.btn{background:#202b3b;color:#f4f6fb;border:1px solid #3a4a5e;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:750}.btn.primary{background:var(--lime);color:#11180b;border-color:var(--lime)}.btn.danger{color:#ffaaa5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#182130,#111823);border-radius:15px;overflow:hidden;animation:rise .25s ease both}.art{height:93px;display:flex;align-items:center;justify-content:center;font-size:42px;background:radial-gradient(circle at 70% 30%,#52694a,#1b2b2b 55%,#111722);position:relative}.art.purple{background:radial-gradient(circle at 70% 30%,#6a4a78,#292238 60%,#111722)}.art.red{background:radial-gradient(circle at 70% 30%,#8c423b,#3c2029 60%,#111722)}.art small{position:absolute;top:8px;left:8px;border-radius:5px;background:#090d15b8;color:var(--lime);font-size:9px;padding:4px 6px}.body{padding:11px}.body h3{font-size:13px;margin:0 0 5px}.muted{font-size:11px;color:var(--muted);line-height:1.5}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.actions .btn{padding:7px 8px;font-size:10px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.pills button{border:1px solid var(--line);background:#131b27;color:var(--muted);border-radius:20px;padding:7px 10px;font-size:10px}.pills button.active{color:var(--lime);border-color:#91b64c}.panel{border:1px solid var(--line);background:var(--panel);padding:14px;border-radius:14px;margin:10px 0}.panel h3{margin:0 0 10px;font-size:14px}.row{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 0}.row:last-child{border-bottom:0}.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#29372b;font-size:22px;flex-shrink:0}.grow{flex:1;min-width:0}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:11px;color:#c8d2df}input,select,textarea{width:100%;background:#0b111b;border:1px solid #354358;border-radius:9px;padding:11px;color:#f3f6fb;min-width:0}textarea{resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:12px}.tag{font-size:10px;color:var(--lime);background:#c9ff6514;padding:4px 7px;border-radius:6px;display:inline-block;margin:2px}.bar{height:6px;background:#293446;border-radius:8px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:var(--lime)}.notice{padding:12px;border-radius:10px;background:#ffffff07;color:var(--muted);font-size:10px;line-height:1.6;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--lime);color:#10170a;font-weight:800;font-size:12px;padding:12px 16px;border-radius:12px;display:none;z-index:10;box-shadow:0 8px 30px #0007;max-width:90vw}.foot{padding:16px;border-top:1px solid var(--line);color:#77859a;font-size:10px;display:flex;justify-content:space-between;gap:8px}.dangerzone{border-color:#633b3e}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:620px){.hero{padding:28px}.wrap{padding:22px}.art{height:120px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:360px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.brand h1{font-size:20px}}
</style></head>
<body>
<header class="hero"><div class="brand"><div class="logo">⚔</div><div><div class="eyebrow">HUNT · BUILD · REPEAT</div><h1>Gamer Hub <span style="color:var(--lime)">MH</span></h1><p>Rise + Sunbreak · Seu companheiro de caça offline.</p></div></div><div class="stats"><div class="stat"><b id="sMon">4</b><span>MONSTROS</span></div><div class="stat"><b id="sBuild">0</b><span>BUILDS SALVAS</span></div><div class="stat"><b id="sMat">0</b><span>MATERIAIS EM ESTOQUE</span></div></div></header>
<nav class="nav" id="nav"><button data-tab="home" class="active">⌂ Início</button><button data-tab="monsters">🐲 Monstros</button><button data-tab="builds">⚔ Builds</button><button data-tab="generator">🧠 Gerador</button><button data-tab="materials">◈ Materiais</button><button data-tab="recipes">⚒ Receitas</button><button data-tab="settings">⚙ Dados</button></nav>
<main class="wrap" id="app"></main><div class="toast" id="toast"></div><footer class="foot"><span>GAMER HUB MH · V0.4 PROTÓTIPO</span><span id="saveState">Armazenamento local</span></footer>
<script>
(function(){
const KEY='gamerHubMH.v04.data';
const seed={monsters:[
{id:1,name:'Malzeno',game:'Monster Hunter: Rise',threat:'★★★★★★',element:'Dragão',weak:'Dragão · Gelo',ailments:'Vampirismo / Frenesi (varia pela forma)',parts:'Cabeça · Peito · Asas · Cauda',tip:'Observe os padrões de investida e a mudança de forma. Esta ficha é resumida; confira recompensas e hitzones na base de referência.',icon:'🦇',kind:'Dragão Ancião'},
{id:2,name:'Nargacuga',game:'Monster Hunter: Rise',threat:'★★★★',element:'Nenhum',weak:'Trovão',ailments:'Nenhum',parts:'Cabeça · Asas · Cauda',tip:'Observe os saltos e a cauda; ataque após os movimentos longos. Consulte a fonte para hitzones e recompensas exatas.',icon:'🐈‍⬛',kind:'Wyvern Voador'},
{id:3,name:'Zinogre',game:'Monster Hunter: Rise',threat:'★★★★★',element:'Trovão',weak:'Gelo',ailments:'Raio / paralisia (conforme ataque)',parts:'Cabeça · Dorso · Pernas dianteiras',tip:'Acompanhe o estado de carga e procure aberturas depois dos ataques pesados.',icon:'🐺',kind:'Wyvern de Presas'},
{id:4,name:'Rathalos',game:'Monster Hunter: Rise',threat:'★★★★',element:'Fogo',weak:'Dragão · Água',ailments:'Veneno · Fogo',parts:'Cabeça · Asas · Cauda',tip:'Prepare-se para ataques aéreos e fogo; confira a missão e as recompensas na base de dados.',icon:'🐉',kind:'Wyvern Voador'}],
builds:[],materials:[],
recipes:[],notes:[],prefs:{game:'Monster Hunter: Rise'}};
let data;try{const parsed=JSON.parse(localStorage.getItem(KEY));data=parsed&&parsed.monsters&&parsed.builds&&parsed.materials?parsed:JSON.parse(JSON.stringify(seed)); if(!Array.isArray(data.recipes)) data.recipes=[]}catch(e){data=JSON.parse(JSON.stringify(seed))}
let tab='home',filter='Todos',search='',editing=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('saveState').textContent='✓ Salvo neste aparelho';return true}catch(e){$('saveState').textContent='Não foi possível salvar';toast('Falha ao salvar os dados. Verifique o espaço disponível.');return false}}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function stats(){$('sMon').textContent=data.monsters.length;$('sBuild').textContent=data.builds.length;$('sMat').textContent=data.materials.reduce((n,m)=>n+(+m.qty||0),0)}
function head(title,btn='',act=''){return `<div class="head"><h2>${title}</h2>${btn?`<button class="btn primary" data-act="${act}">${btn}</button>`:''}</div>`}
function monsterCard(m){return `<article class="card"><div class="art ${m.element==='Fogo'?'red':''}"><small>${esc(m.game==='Monster Hunter: Rise'?'RISE / SUNBREAK':'WORLD / ICEBORNE')}</small>${esc(m.icon||'🐲')}</div><div class="body"><h3>${esc(m.name)}</h3><div class="muted">${esc(m.kind)} · ${esc(m.threat)}</div><div style="margin:8px 0"><span class="tag">Fraqueza: ${esc(m.weak)}</span></div><div class="muted">Elemento: ${esc(m.element)}<br>Partes: ${esc(m.parts)}</div><div class="actions"><button class="btn" data-act="detail" data-id="${m.id}">Ficha</button><button class="btn" data-act="editmonster" data-id="${m.id}">Editar</button><button class="btn danger" data-act="delmonster" data-id="${m.id}">Excluir</button></div></div></article>`}
function gameOpts(selected){return ['Monster Hunter: World','Monster Hunter: Rise','Monster Hunter Wilds','Outro'].map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('')}
function render(){stats();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let a=$('app');
if(tab==='home'){let todo=data.materials.filter(m=>m.qty<m.needed).length;a.innerHTML=head('Painel da caçada')+`<div class="panel"><div class="eyebrow">HUNTER STATUS</div><h2 style="margin:7px 0 4px;font-size:22px">A próxima caçada começa aqui.</h2><p class="muted">Consulte fraquezas, monte seu equipamento e acompanhe os materiais que faltam — mesmo sem internet.</p><div class="actions"><button class="btn primary" data-act="goto" data-to="monsters">Consultar monstros</button><button class="btn" data-act="goto" data-to="builds">Criar build</button></div></div><div class="two"><div class="panel"><h3>⚔ Builds</h3><b style="font-size:24px">${data.builds.length}</b><p class="muted">configurações salvas</p></div><div class="panel"><h3>◈ Coleta</h3><b style="font-size:24px">${todo}</b><p class="muted">materiais abaixo da meta</p></div></div>${head('Monstros para consultar','Ver todos','gotoMonsters')}<div class="grid">${data.monsters.slice(0,2).map(monsterCard).join('')}</div><div class="notice">As fichas iniciais são exemplos de referência. Confirme fraquezas e materiais para o jogo e a atualização exatos: valores podem variar entre títulos e versões.</div>`}
if(tab==='monsters'){let ms=data.monsters.filter(m=>(filter==='Todos'||m.game===filter)&&(!search||m.name.toLowerCase().includes(search.toLowerCase())));a.innerHTML=head('Bestiário','＋ Monstro','newmonster')+`<div class="field"><label>Pesquisar monstro</label><input id="mSearch" value="${esc(search)}" placeholder="Ex.: Odogaron, Rathalos..."></div><div class="pills">${['Todos','Monster Hunter: Rise','Monster Hunter: World','Monster Hunter Wilds'].map(f=>`<button class="${filter===f?'active':''}" data-act="filter" data-filter="${esc(f)}">${f==='Todos'?f:f.replace('Monster Hunter: ','')}</button>`).join('')}</div><div class="grid">${ms.map(monsterCard).join('')||'<div class="empty">Nenhum monstro encontrado. Experimente outro filtro ou cadastre um.</div>'}</div>`;let inp=$('mSearch');inp.addEventListener('input',()=>{search=inp.value;let pos=inp.selectionStart;render();let next=$('mSearch');next.focus();next.setSelectionRange(pos,pos)})}
if(tab==='builds'){a.innerHTML=head('Suas builds','＋ Nova build','newbuild')+(data.builds.map(b=>`<div class="panel"><div class="row"><div class="ico">⚔️</div><div class="grow"><h3>${esc(b.name)}</h3><div class="muted">${esc(b.game)} · ${esc(b.weapon)}</div></div><button class="btn danger" data-act="delbuild" data-id="${b.id}">Excluir</button></div><p><b>Arma:</b> ${esc(b.weapon)}</p><p><b>Armadura:</b> ${esc(b.armor||'—')}</p><p><b>Habilidades:</b> ${esc(b.skills||'—')}</p><p class="muted">${esc(b.note||'Sem observações')}</p><button class="btn" data-act="editbuild" data-id="${b.id}">Editar build</button></div>`).join('')||'<div class="empty">Você ainda não salvou builds. Crie uma para registrar arma, armadura e habilidades.</div>')+`<div class="notice">Builds são notas pessoais; o protótipo ainda não valida automaticamente habilidades, slots ou compatibilidade de equipamentos.</div>`}
if(tab==='generator'){a.innerHTML=head('Gerador de builds')+`<div class="panel"><div class="eyebrow">ASSISTENTE DE BUILD</div><h3 style="margin-top:8px">Monte um plano para sua arma</h3><p class="muted">Escolha arma, objetivo e progresso. O gerador prioriza habilidades úteis e explica o motivo; não inventa uma armadura ou receita como se estivesse verificada.</p><div class="field"><label>Tipo de arma</label><select id="gWeapon"><option>Transmachado (Switch Axe)</option><option>Espadão</option><option>Espada Longa</option><option>Lâmina Dínamo (Charge Blade)</option><option>Duplas-Lâminas</option><option>Espada e Escudo</option><option>Martelo</option><option>Berrante de Caça</option><option>Lança</option><option>Lançarma</option><option>Glaive Inseto</option><option>Arco</option><option>Fuzilarco Leve</option><option>Fuzilarco Pesado</option></select></div><div class="field"><label>Objetivo principal</label><select id="gGoal"><option value="raw">Dano físico / afinidade</option><option value="element">Dano elemental</option><option value="comfort">Conforto e sobrevivência</option><option value="status">Estados anormais / suporte</option></select></div><div class="field"><label>Progresso</label><select id="gStage"><option value="story">História / Ranque Alto</option><option value="mr">Ranque Mestre em progresso</option><option value="endgame">Pós-jogo / Anomalia</option></select></div><button class="btn primary" style="width:100%" data-act="generatebuild">Gerar recomendações</button><div id="buildResult"></div></div><div class="panel"><h3>Simulador externo de referência</h3><p class="muted">Para conferir peças, slots, decorações e combinações com dados completos, abra o montador especializado. Ele requer internet.</p><div class="actions"><a class="btn" href="https://gamecat.fun/rise/en/" target="_blank" rel="noopener">Abrir GameCat</a><a class="btn" href="https://mhrise.kiranico.com/pt-BR" target="_blank" rel="noopener">Abrir Kiranico PT-BR</a></div></div><div class="notice">Limitação desta versão: as recomendações são um ponto de partida por prioridade de habilidade. Ainda não é um otimizador matemático que varre todo o equipamento, talismãs e aprimoramentos de Anomalia. Confira as habilidades disponíveis na sua versão e estilo de jogo.</div>`}
if(tab==='materials'){a.innerHTML=head('Lista de materiais','＋ Material','newmat')+(data.materials.map(m=>`<div class="panel"><div class="row"><div class="ico">◈</div><div class="grow"><h3>${esc(m.name)}</h3><div class="muted">${esc(m.game)} · ${esc(m.note||'Material')}</div><div class="bar"><span style="width:${Math.min(100,100*(+m.qty||0)/Math.max(1,+m.needed||1))}%"></span></div><p class="muted">${+m.qty||0} de ${+m.needed||0} necessários</p></div></div><div class="actions"><button class="btn" data-act="qty" data-id="${m.id}" data-delta="-1">− 1</button><button class="btn" data-act="qty" data-id="${m.id}" data-delta="1">＋ 1</button><button class="btn" data-act="editmat" data-id="${m.id}">Editar</button><button class="btn danger" data-act="delmat" data-id="${m.id}">Excluir</button></div></div>`).join('')||'<div class="empty">Sua lista está vazia. Adicione materiais para acompanhar a coleta.</div>')+`<div class="notice">As quantidades ficam salvas no aparelho. O contador não consulta automaticamente seu inventário do jogo.</div>`}
if(tab==='recipes'){a.innerHTML=head('Receitas de equipamento','＋ Receita','newrecipe')+(data.recipes.map(r=>`<div class="panel"><div class="row"><div class="ico">⚒️</div><div class="grow"><h3>${esc(r.name)}</h3><div class="muted">${esc(r.game)} · ${esc(r.equipment)}</div><span class="tag">${esc(r.status||'Provisória')}</span></div><button class="btn danger" data-act="delrecipe" data-id="${r.id}">Excluir</button></div><p><b>Materiais necessários</b></p>${(r.items||[]).map(it=>`<div class="row"><div class="grow"><span class="muted">${esc(it.name)}</span></div><b>× ${+it.qty||1}</b><button class="btn" data-act="addmaterial" data-name="${esc(it.name)}" data-game="${esc(r.game)}">＋ Lista</button></div>`).join('')}<p class="muted">Fonte: ${esc(r.source||'Não informada')}</p></div>`).join('')||'<div class="empty">Nenhuma receita cadastrada. Adicione receitas verificadas do jogo.</div>')+`<div class="notice">As receitas de exemplo são provisórias. Confira materiais e quantidades na forja do jogo ou em uma fonte comunitária confiável antes de usar para planejar uma fabricação.</div>`}
if(tab==='settings'){a.innerHTML=head('Dados e preferências')+`<div class="panel"><h3>💾 Armazenamento local</h3><p class="muted">Seus dados ficam no armazenamento do navegador/WebView deste aparelho. Não é necessária conta nem conexão com servidor.</p><div class="actions"><button class="btn primary" data-act="export">Exportar backup JSON</button><button class="btn" data-act="import">Importar backup</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div></div><div class="panel"><h3>🎮 Jogo preferido</h3><div class="field"><label>Escolha o título padrão para novas entradas</label><select id="prefGame">${gameOpts(data.prefs.game)}</select></div><button class="btn primary" data-act="savepref">Salvar preferência</button></div><div class="panel dangerzone"><h3>⚠ Zona de risco</h3><p class="muted">Apaga os dados locais deste protótipo. Exporte um backup antes de continuar.</p><button class="btn danger" data-act="reset">Restaurar dados de demonstração</button></div><div class="notice">Importante: limpar os dados do app, desinstalar o app ou limpar os dados do navegador pode apagar as informações locais. Faça backups periódicos.</div>`}
}
function form(title,fields,callback){$('app').innerHTML=`<div class="head"><h2>${title}</h2><button class="btn" data-act="cancel">Voltar</button></div><form id="editor">${fields}<button class="btn primary" type="submit" style="width:100%;margin-top:8px">Salvar</button></form>`;$('editor').addEventListener('submit',e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.currentTarget)))})}
function monsterForm(m={}){form(m.id?'Editar monstro':'Cadastrar monstro',`<div class="field"><label>Nome</label><input name="name" required maxlength="70" value="${esc(m.name||'')}" placeholder="Nome do monstro"></div><div class="field"><label>Jogo</label><select name="game">${gameOpts(m.game||data.prefs.game)}</select></div><div class="formgrid"><div class="field"><label>Tipo</label><input name="kind" value="${esc(m.kind||'')}" placeholder="Flying Wyvern"></div><div class="field"><label>Ameaça</label><select name="threat">${['★','★★','★★★','★★★★','★★★★★','★★★★★★'].map(x=>`<option ${x===(m.threat||'★★★')?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="formgrid"><div class="field"><label>Elemento do monstro</label><input name="element" value="${esc(m.element||'')}" placeholder="Fogo"></div><div class="field"><label>Fraqueza principal</label><input name="weak" value="${esc(m.weak||'')}" placeholder="Água, gelo..."></div></div><div class="field"><label>Estados / aflições</label><input name="ailments" value="${esc(m.ailments||'')}" placeholder="Veneno, sangramento..."></div><div class="field"><label>Partes vulneráveis</label><input name="parts" value="${esc(m.parts||'')}" placeholder="Cabeça, asas..."></div><div class="field"><label>Estratégia</label><textarea name="tip" rows="3">${esc(m.tip||'')}</textarea></div><div class="field"><label>Ícone</label><select name="icon">${['🐲','🐺','🦖','🦎','🦂','🐻','🐉','🦅','👹'].map(x=>`<option ${x===(m.icon||'🐲')?'selected':''}>${x}</option>`).join('')}</select></div>`,d=>{if(m.id)Object.assign(m,d);else data.monsters.push({id:Date.now(),...d});save();tab='monsters';render();toast('Ficha do monstro salva')})}
function buildForm(b={}){form(b.id?'Editar build':'Nova build',`<div class="field"><label>Nome da build</label><input name="name" required maxlength="70" value="${esc(b.name||'')}" placeholder="Ex.: Odogaron — afinidade"></div><div class="field"><label>Jogo</label><select name="game">${gameOpts(b.game||data.prefs.game)}</select></div><div class="field"><label>Arma</label><input name="weapon" required maxlength="80" value="${esc(b.weapon||'')}" placeholder="Espada longa, arco..."></div><div class="field"><label>Armadura</label><input name="armor" maxlength="140" value="${esc(b.armor||'')}" placeholder="Peças de armadura"></div><div class="field"><label>Habilidades e decorações</label><textarea name="skills" rows="3" maxlength="500">${esc(b.skills||'')}</textarea></div><div class="field"><label>Notas</label><textarea name="note" rows="3" maxlength="500">${esc(b.note||'')}</textarea></div>`,d=>{if(b.id)Object.assign(b,d);else data.builds.push({id:Date.now(),...d});save();tab='builds';render();toast('Build salva no aparelho')})}
function matForm(m={}){form(m.id?'Editar material':'Novo material',`<div class="field"><label>Nome do material</label><input name="name" required maxlength="90" value="${esc(m.name||'')}" placeholder="Escama, garra, minério..."></div><div class="field"><label>Jogo</label><select name="game">${gameOpts(m.game||data.prefs.game)}</select></div><div class="formgrid"><div class="field"><label>Quantidade atual</label><input name="qty" type="number" min="0" max="99999" required value="${+m.qty||0}"></div><div class="field"><label>Quantidade necessária</label><input name="needed" type="number" min="1" max="99999" required value="${+m.needed||1}"></div></div><div class="field"><label>Observação</label><input name="note" maxlength="120" value="${esc(m.note||'')}" placeholder="Origem ou equipamento"></div>`,d=>{d.qty=+d.qty;d.needed=+d.needed;if(m.id)Object.assign(m,d);else data.materials.push({id:Date.now(),...d});save();tab='materials';render();toast('Material salvo')})}
function recipeForm(){form('Nova receita',`<div class="field"><label>Nome da receita / equipamento</label><input name="name" required maxlength="90" placeholder="Ex.: Espada, armadura, decoração"></div><div class="field"><label>Jogo</label><select name="game">${gameOpts('Monster Hunter: Rise')}</select></div><div class="field"><label>Peça / categoria</label><input name="equipment" required maxlength="100" placeholder="Arma, cabeça, peito..."></div><div class="field"><label>Materiais (um por linha, formato: nome | quantidade)</label><textarea name="items" rows="5" required placeholder="Escama de exemplo | 2&#10;Garra de exemplo | 1"></textarea></div><div class="field"><label>Estado da informação</label><select name="status"><option>Verificada no jogo</option><option>Verificada em fonte comunitária</option><option>Provisória — conferir</option></select></div><div class="field"><label>Fonte / URL / observação</label><input name="source" maxlength="240" placeholder="URL ou nome da fonte consultada"></div>`,d=>{let items=d.items.split(/\\r?\\n/).map(line=>{let parts=line.split('|');return {name:(parts[0]||'').trim(),qty:Math.max(1,parseInt(parts[1],10)||1}}).filter(x=>x.name);if(!items.length){toast('Adicione pelo menos um material');return}data.recipes.push({id:Date.now(),name:d.name,game:d.game,equipment:d.equipment,items,status:d.status,source:d.source});save();tab='recipes';render();toast('Receita salva')})}
function download(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gamer-hub-mh-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportado')}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}});
$('app').addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=+b.dataset.id,ob;
if(act==='goto'){tab=b.dataset.to;render()}if(act==='gotoMonsters'){tab='monsters';render()}if(act==='filter'){filter=b.dataset.filter;render()}
if(act==='generatebuild'){const weapon=$('gWeapon').value,goal=$('gGoal').value,stage=$('gStage').value;const common=goal==='element'?['Ataque Elemental','Exploração Elemental','Aumento Elemental']:goal==='comfort'?['Bênção Divina','Aprimoramento de Defesa','Constituição']:goal==='status'?['Ataque de Paralisia/Veneno (conforme arma)','Ataque Crítico','Aprimoramento de Estado']:['Olho Crítico','Exploração da Fraqueza','Reforço Crítico','Ataque'];let weaponSkills=[];if(weapon.includes('Transmachado'))weaponSkills=['Aprimoramento de Troca Rápida','Concentração (se aplicável ao conjunto)','Artilharia não é prioridade universal'];else if(weapon.includes('Espadão'))weaponSkills=['Foco','Saque Crítico (se usar estilo de saque)','Reforço Crítico'];else if(weapon.includes('Duplas'))weaponSkills=['Constituição','Aprimoramento de Troca Rápida','habilidades elementais adequadas ao monstro'];else if(weapon.includes('Lâmina Dínamo'))weaponSkills=['Artilharia (para estilos/frasco compatíveis)','Aprimoramento de Troca Rápida','Foco (conforme estilo)'];else if(weapon.includes('Arco'))weaponSkills=['Constituição','Tiro Normal/Disperso/Piercing conforme tipo','habilidades elementais adequadas'];else if(weapon.includes('Fuzilarco'))weaponSkills=['Recuo/recarga conforme munição','Tiro Normal/Disperso/Piercing conforme munição','Aprimoramento de munição correspondente'];else weaponSkills=['habilidades de afinidade e dano compatíveis com a arma','Aprimoramento de Troca Rápida conforme estilo','habilidades defensivas se estiver aprendendo o monstro'];let stageNote=stage==='story'?'Priorize habilidades fáceis de obter e não gaste recursos raros em peças que trocará logo.':stage==='mr'?'Misture dano e conforto; avance as peças conforme libera monstros e decorações de Ranque Mestre.':'Considere talismã, decorações e aprimoramentos de Anomalia; compare o resultado final no simulador.';const items=[...common,...weaponSkills].filter((x,i,a)=>a.indexOf(x)===i);$('buildResult').innerHTML='<div class="panel"><h3>Plano recomendado — '+esc(weapon)+'</h3><p class="muted">Objetivo: '+esc($('gGoal').selectedOptions[0].text)+' · Etapa: '+esc($('gStage').selectedOptions[0].text)+'</p>'+items.map((x,i)=>'<div class="row"><div class="ico">'+(i+1)+'</div><div class="grow"><b>'+esc(x)+'</b><div class="muted">Prioridade sugerida; valide a compatibilidade com sua arma e estilo.</div></div></div>').join('')+'<p class="muted">'+esc(stageNote)+'</p><button class="btn primary" data-act="savegenerated" data-weapon="'+esc(weapon)+'" data-goal="'+esc(goal)+'" data-stage="'+esc(stage)+'" data-skills="'+esc(items.join(' · '))+'">Salvar como build</button></div>';toast('Plano de habilidades gerado')}
if(act==='savegenerated'){const weapon=b.dataset.weapon,goal=b.dataset.goal,stage=b.dataset.stage,skills=b.dataset.skills;data.builds.push({id:Date.now(),name:'Plano '+weapon,game:'Monster Hunter: Rise + Sunbreak',weapon,armor:'A definir no simulador',skills,note:'Objetivo: '+goal+'; progresso: '+stage+'. Plano inicial gerado por prioridades; confirmar compatibilidade.'});save();tab='builds';render();toast('Plano salvo nas suas builds')}

if(act==='newmonster')monsterForm();if(act==='editmonster'){ob=data.monsters.find(x=>x.id===id);if(ob)monsterForm(ob)}
if(act==='delmonster'&&confirm('Excluir esta ficha?')){data.monsters=data.monsters.filter(x=>x.id!==id);save();render();toast('Ficha excluída')}
if(act==='detail'){ob=data.monsters.find(x=>x.id===id);if(ob){$('app').innerHTML=`<div class="head"><h2>${esc(ob.name)}</h2><button class="btn" data-act="backmon">Voltar</button></div><div class="panel"><div class="art">${esc(ob.icon||'🐲')}</div><p class="muted">${esc(ob.game)} · ${esc(ob.kind)} · ${esc(ob.threat)}</p><h3>Fraqueza principal</h3><span class="tag">${esc(ob.weak)}</span><h3 style="margin-top:16px">Elemento do monstro</h3><p>${esc(ob.element)}</p><h3>Estados e aflições</h3><p>${esc(ob.ailments)}</p><h3>Partes vulneráveis</h3><p>${esc(ob.parts)}</p><h3>Estratégia pessoal</h3><p>${esc(ob.tip)}</p><button class="btn primary" data-act="editmonster" data-id="${ob.id}">Editar ficha</button></div><div class="notice">Use as fichas como referência; confirme os dados específicos da versão do jogo.</div>`}}
if(act==='backmon'){tab='monsters';render()}
if(act==='newbuild')buildForm();if(act==='editbuild'){ob=data.builds.find(x=>x.id===id);if(ob)buildForm(ob)}if(act==='delbuild'&&confirm('Excluir esta build?')){data.builds=data.builds.filter(x=>x.id!==id);save();render();toast('Build excluída')}
if(act==='newrecipe')recipeForm();if(act==='delrecipe'&&confirm('Excluir esta receita?')){data.recipes=data.recipes.filter(x=>x.id!==id);save();render();toast('Receita removida')}if(act==='addmaterial'){let name=b.dataset.name,game=b.dataset.game,found=data.materials.find(m=>m.name===name&&m.game===game);if(found){toast('Esse material já está na sua lista')}else{data.materials.push({id:Date.now(),name,qty:0,needed:1,game,note:'Adicionado a partir de uma receita'});save();toast('Material adicionado à lista de coleta')}}if(act==='newmat')matForm();if(act==='editmat'){ob=data.materials.find(x=>x.id===id);if(ob)matForm(ob)}if(act==='delmat'&&confirm('Excluir este material?')){data.materials=data.materials.filter(x=>x.id!==id);save();render();toast('Material excluído')}if(act==='qty'){ob=data.materials.find(x=>x.id===id);if(ob){ob.qty=Math.max(0,(+ob.qty||0)+(+b.dataset.delta));save();render()}}
if(act==='cancel'){render()}if(act==='savepref'){data.prefs.game=$('prefGame').value;save();toast('Preferência salva')}
if(act==='export')download();if(act==='import')$('fileInput').click();if(act==='reset'&&confirm('Restaurar os dados de demonstração? Seus dados atuais serão substituídos.')){data=JSON.parse(JSON.stringify(seed));save();tab='home';render();toast('Dados de demonstração restaurados')}
});
$('app').addEventListener('change',e=>{if(e.target.id==='fileInput'&&e.target.files[0]){const reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.monsters)||!Array.isArray(d.builds)||!Array.isArray(d.materials))throw Error('invalid');if(!Array.isArray(d.recipes))d.recipes=[];data=d;save();render();toast('Backup importado')}catch(err){toast('Arquivo inválido ou incompatível')}};reader.readAsText(e.target.files[0])}});
render();save();
})();
</script></body></html>
